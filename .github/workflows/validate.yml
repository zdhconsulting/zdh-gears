name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Routing, launcher, receipt, package and installer tests
        shell: pwsh
        run: ./tests/run-tests.ps1
