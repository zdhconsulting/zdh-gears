name: validate
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File tests/routing-smoke.ps1
      - run: pwsh -NoProfile -File scripts/zdh-gears-doctor.ps1 -Json
      - run: pwsh -NoProfile -Command '$m=Get-Content .codex-plugin/plugin.json|ConvertFrom-Json; $v=(Get-Content .agents/plugins/marketplace.json|ConvertFrom-Json).plugins[0].version; if($m.version -ne $v){throw "version mismatch"}; if(!(Test-Path assets/zdh-gears-icon.svg)){throw "icon missing"}'

